name: Build Globed

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - 'docs/*.md'
      - 'previews/**'
      - 'README.md'
      - 'rescale.py'

  # pull_request:

env:
  GEODE_SDK_VERSION: 'v6.0.0-beta.3'

jobs:
  build-async-load:
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            os: windows-latest
            build-config: RelWithDebInfo

          - name: Android32
            os: ubuntu-latest
            target: Android32

          - name: Android64
            os: ubuntu-latest
            target: Android64

    name: AsyncLoadAPI (${{ matrix.config.name }})
    runs-on: ${{ matrix.config.os }}

    steps:
      - name: Checkout AsyncLoadAPI
        uses: actions/checkout@v6
        with:
          repository: dankmeme01/AsyncLoadAPI

      - name: Patch AsyncLoadAPI for Geode beta.3
        shell: bash
        run: |
          if python --version >/dev/null 2>&1; then PY=python; else PY=python3; fi
          $PY - << 'EOF'
          import os, pathlib, re, textwrap

          ver = os.environ['GEODE_SDK_VERSION'].lstrip('v')
          for name in ('mod.json', 'mod.json.template'):
              p = pathlib.Path(name)
              if p.exists():
                  text = p.read_text(encoding='utf-8')
                  new_text = re.sub(r'("geode"\s*:\s*")[^"]*(")', rf'\g<1>{ver}\g<2>', text, count=1)
                  if new_text != text:
                      p.write_text(new_text, encoding='utf-8')
                      print(f'Updated {name} geode -> {ver}')

          ev = pathlib.Path('include/AsyncLoad/util/EventDefine.hpp')
          src = ev.read_text(encoding='utf-8').replace('\r\n', '\n')
          old = (
              '#define AL_EXPORT_MEMBER_QUALS(...) GEODE_EVENT_EXPORT_MEMBER_QUALS(__VA_ARGS__)\n'
              '#define AL_EXPORT_MEMBER_CONST(...) GEODE_EVENT_EXPORT_MEMBER_CONST(__VA_ARGS__)'
          )
          assert old in src, 'Expected AL_EXPORT_MEMBER macros not found in EventDefine.hpp'

          new = textwrap.dedent(r"""
              #ifndef AL_EVENT_DEFINE_HELPERS_DEFINED
              #define AL_EVENT_DEFINE_HELPERS_DEFINED
              #include <type_traits>

              namespace async_load_event_detail {
                  template <typename Dst, bool Const, bool Volatile>
                  struct ApplyCv { using type = Dst; };
                  template <typename Dst>
                  struct ApplyCv<Dst, true, false> { using type = const Dst; };
                  template <typename Dst>
                  struct ApplyCv<Dst, false, true> { using type = volatile Dst; };
                  template <typename Dst>
                  struct ApplyCv<Dst, true, true> { using type = const volatile Dst; };

                  template <typename R, typename... Args>
                  struct ApplyCv<R(Args...), true, false> { using type = R(Args...) const; };
                  template <typename R, typename... Args>
                  struct ApplyCv<R(Args...), false, true> { using type = R(Args...) volatile; };
                  template <typename R, typename... Args>
                  struct ApplyCv<R(Args...), true, true> { using type = R(Args...) const volatile; };

                  template <typename Dst, bool Const, bool Volatile>
                  using ApplyCvT = typename ApplyCv<Dst, Const, Volatile>::type;

                  template <class Class, class Fn>
                  struct AddClass { using type = Fn Class::*; };

                  template <class Class, class Fn>
                  using AddClassT = typename AddClass<std::remove_cvref_t<Class>, Fn>::type;
              }

              #ifdef __clang__
              # define AL_INTERNAL_LINKAGE __attribute__((internal_linkage))
              #else
              # define AL_INTERNAL_LINKAGE
              #endif

              #define AL_CONCAT_IMPL(a, b) a##b
              #define AL_CONCAT(a, b) AL_CONCAT_IMPL(a, b)
              #define AL_UNIQ_NAME(sfx) AL_CONCAT(AL_CONCAT(AL_CONCAT(_al_ev_fn_, sfx), __COUNTER__), __LINE__)

              #define AL_GET_FNTYPE(ret, params, uniq_name) \
                  decltype([] { \
                      ret uniq_name params noexcept(false); \
                      return &uniq_name; \
                  }())

              #define AL_GET_MEMBERFNTYPE(Class, ret, params, quals, uniq_name) \
                  async_load_event_detail::AddClassT<Class, \
                      async_load_event_detail::ApplyCvT< \
                          std::remove_pointer_t<AL_GET_FNTYPE(ret, params, uniq_name)>, \
                          std::is_const_v<int quals>, \
                          std::is_volatile_v<int quals> \
                      > \
                  >

              #define AL_CALL_MEMBER_QUALS(Class, ret, name, params, quals, args, eventID) \
                  AL_INTERNAL_LINKAGE inline ret (name) params quals { \
                      using FnType = AL_GET_MEMBERFNTYPE(Class, ret, params, quals, AL_UNIQ_NAME(name)); \
                      static auto storage = geode::geode_internal::callEventExportListener<FnType>(eventID); \
                      if (!storage) return geode::geode_internal::getValueOnFailed<ret>(); \
                      return storage args; \
                  }

              #define AL_DEFINE_MEMBER_QUALS(Class, ret, name, params, quals, args, eventID) \
                  ret name params quals; \
                  static inline bool AL_UNIQ_NAME(_geode_event_export_reg_) \
                  = geode::geode_internal::getEventExportListener(static_cast< \
                      AL_GET_MEMBERFNTYPE(Class, ret, params, quals, AL_UNIQ_NAME(name)) \
                  >(&Class::name), eventID);
              #endif

              #undef AL_EXPORT_MEMBER_QUALS
              #undef AL_EXPORT_MEMBER_QUALS_6
              #undef AL_EXPORT_MEMBER_QUALS_7
              #undef AL_EXPORT_MEMBER_QUALS_PICK
              #if defined(GEODE_EVENT_EXPORT_MEMBER_QUALS) && defined(GEODE_EVENT_EXPORT_DEFINE_MEMBER_QUALS)
              # define AL_EXPORT_MEMBER_QUALS(...) GEODE_EVENT_EXPORT_MEMBER_QUALS(__VA_ARGS__)
              #else
              # ifdef GEODE_DEFINE_EVENT_EXPORTS
              #  define AL_EXPORT_MEMBER_QUALS_6(Class, ret, name, params, quals, args) \
                  AL_DEFINE_MEMBER_QUALS(Class, ret, name, params, quals, args, GEODE_EVENT_EXPORT_ID_FOR(#Class "::" #name, #args))
              #  define AL_EXPORT_MEMBER_QUALS_7(Class, ret, name, params, quals, args, eventID) \
                  AL_DEFINE_MEMBER_QUALS(Class, ret, name, params, quals, args, eventID)
              # else
              #  define AL_EXPORT_MEMBER_QUALS_6(Class, ret, name, params, quals, args) \
                  AL_CALL_MEMBER_QUALS(Class, ret, name, params, quals, args, GEODE_EVENT_EXPORT_ID_FOR(#Class "::" #name, #args))
              #  define AL_EXPORT_MEMBER_QUALS_7(Class, ret, name, params, quals, args, eventID) \
                  AL_CALL_MEMBER_QUALS(Class, ret, name, params, quals, args, eventID)
              # endif
              # define AL_EXPORT_MEMBER_QUALS_PICK(_1, _2, _3, _4, _5, _6, _7, NAME, ...) NAME
              # define AL_EXPORT_MEMBER_QUALS(...) \
                  AL_EXPORT_MEMBER_QUALS_PICK(__VA_ARGS__, AL_EXPORT_MEMBER_QUALS_7, AL_EXPORT_MEMBER_QUALS_6)(__VA_ARGS__)
              #endif

              #undef AL_EXPORT_MEMBER_CONST
              #undef AL_EXPORT_MEMBER_CONST_5
              #undef AL_EXPORT_MEMBER_CONST_6
              #undef AL_EXPORT_MEMBER_CONST_PICK
              #if defined(GEODE_EVENT_EXPORT_MEMBER_CONST) && defined(GEODE_EVENT_EXPORT_DEFINE_MEMBER_QUALS)
              # define AL_EXPORT_MEMBER_CONST(...) GEODE_EVENT_EXPORT_MEMBER_CONST(__VA_ARGS__)
              #else
              # ifdef GEODE_DEFINE_EVENT_EXPORTS
              #  define AL_EXPORT_MEMBER_CONST_5(Class, ret, name, params, args) \
                  AL_DEFINE_MEMBER_QUALS(Class, ret, name, params, const, args, GEODE_EVENT_EXPORT_ID_FOR(#Class "::" #name, #args))
              #  define AL_EXPORT_MEMBER_CONST_6(Class, ret, name, params, args, eventID) \
                  AL_DEFINE_MEMBER_QUALS(Class, ret, name, params, const, args, eventID)
              # else
              #  define AL_EXPORT_MEMBER_CONST_5(Class, ret, name, params, args) \
                  AL_CALL_MEMBER_QUALS(Class, ret, name, params, const, args, GEODE_EVENT_EXPORT_ID_FOR(#Class "::" #name, #args))
              #  define AL_EXPORT_MEMBER_CONST_6(Class, ret, name, params, args, eventID) \
                  AL_CALL_MEMBER_QUALS(Class, ret, name, params, const, args, eventID)
              # endif
              # define AL_EXPORT_MEMBER_CONST_PICK(_1, _2, _3, _4, _5, _6, NAME, ...) NAME
              # define AL_EXPORT_MEMBER_CONST(...) \
                  AL_EXPORT_MEMBER_CONST_PICK(__VA_ARGS__, AL_EXPORT_MEMBER_CONST_6, AL_EXPORT_MEMBER_CONST_5)(__VA_ARGS__)
              #endif
          """).strip()

          ev.write_text(src.replace(old, new, 1), encoding='utf-8')
          print('Patched', ev)
          EOF

      - name: Build AsyncLoadAPI
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: ${{ env.GEODE_SDK_VERSION }}
          build-config: ${{ matrix.config.build-config || 'Release' }}
          combine: false
          target: ${{ matrix.config.target }}
          ccache-variant: 'sccache'

      - name: Upload AsyncLoadAPI artifact
        uses: actions/upload-artifact@v6
        with:
          name: async-load-api-${{ matrix.config.name }}
          path: |
            build/*.geode
            build/*.lib
            build/*.so
            build/RelWithDebInfo/*.lib
            build/Release/*.lib
            include/**
          if-no-files-found: error

  build:
    needs: build-async-load
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            os: windows-latest
            build-config: RelWithDebInfo

          - name: Android32
            os: ubuntu-latest
            target: Android32

          - name: Android64
            os: ubuntu-latest
            target: Android64

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download AsyncLoadAPI artifact
        uses: actions/download-artifact@v6
        with:
          name: async-load-api-${{ matrix.config.name }}
          path: async-load-artifact

      - name: Configure AsyncLoadAPI and Windows linker fix
        shell: bash
        run: |
          if python --version >/dev/null 2>&1; then PY=python; else PY=python3; fi
          $PY - << 'EOF'
          import os, pathlib, re

          matches = list(pathlib.Path('async-load-artifact').rglob('AsyncLoad/Manager.hpp'))
          assert matches, 'AsyncLoad headers not found in artifact'
          inc_dir = matches[0].parent.parent.resolve()

          ext = '*.lib' if os.name == 'nt' else '*.so'
          libs = list(pathlib.Path('async-load-artifact').rglob(ext))
          assert libs, f'AsyncLoad library ({ext}) not found in artifact'
          lib_path = libs[0].resolve()

          gb = pathlib.Path('geobuild.py')
          gb_text = gb.read_text(encoding='utf-8').replace('\r\n', '\n')
          gb_text = re.sub(
              r'^([ \t]*)#[ \t]*(build\.add_geode_dep\(\s*"dankmeme\.async-load-api".*\))$',
              r'\1\2',
              gb_text,
              flags=re.MULTILINE,
          )
          if '"dankmeme.async-load-api"' not in gb_text:
              gb_text = gb_text.replace(
                  'build.add_geode_dep("dankmeme.argon", ">=v2.0.0-alpha.1")',
                  'build.add_geode_dep("dankmeme.argon", ">=v2.0.0-alpha.1")\n    build.add_geode_dep("dankmeme.async-load-api", ">=v1.0.0")',
                  1,
              )
          gb.write_text(gb_text, encoding='utf-8')

          cm = pathlib.Path('CMakeLists.txt')
          cm_text = cm.read_text(encoding='utf-8').replace('\r\n', '\n')
          target_line = 'include("${CMAKE_CURRENT_BINARY_DIR}/geobuild-gen.cmake")'
          assert target_line in cm_text, 'include(geobuild-gen.cmake) not found in CMakeLists.txt'

          patch = f'''
          file(READ "${{CMAKE_CURRENT_BINARY_DIR}}/geobuild-gen.cmake" _gb_gen)
          string(REGEX REPLACE "setup_geode_mod\\\\(([^)]*)\\\\)" "setup_geode_mod(\\\\1 EXTERNALS dankmeme.async-load-api:>=1.0.0)" _gb_gen "${{_gb_gen}}")
          file(WRITE "${{CMAKE_CURRENT_BINARY_DIR}}/geobuild-gen.cmake" "${{_gb_gen}}")
          {target_line}
          target_include_directories(${{PROJECT_NAME}} PUBLIC "{inc_dir.as_posix()}")
          target_link_libraries(${{PROJECT_NAME}} PRIVATE "{lib_path.as_posix()}")
          if (WIN32)
              file(WRITE "${{CMAKE_CURRENT_BINARY_DIR}}/win_appdelegate_fix.cpp" "#include <Geode/Geode.hpp>\\n#include <Geode/binding/AppDelegate.hpp>\\nAppDelegate::~AppDelegate() {{}}\\n")
              set_source_files_properties("${{CMAKE_CURRENT_BINARY_DIR}}/win_appdelegate_fix.cpp" PROPERTIES SKIP_UNITY_BUILD_INCLUSION ON SKIP_PRECOMPILE_HEADERS ON)
              target_sources(${{PROJECT_NAME}} PRIVATE "${{CMAKE_CURRENT_BINARY_DIR}}/win_appdelegate_fix.cpp")
          endif()
          '''.strip()

          cm.write_text(cm_text.replace(target_line, patch, 1), encoding='utf-8')
          print('AsyncLoadAPI include:', inc_dir)
          print('AsyncLoadAPI library:', lib_path)
          EOF

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        env:
          GLOBED_SENTRY_URL: ${{ vars.GLOBED_SENTRY_URL }}
          GLOBED_SENTRY_KEY: ${{ vars.GLOBED_SENTRY_KEY }}
        with:
          sdk: ${{ env.GEODE_SDK_VERSION }}
          build-config: ${{ matrix.config.build-config || 'Release' }}
          configure-args: '-DGLOBED_RELEASE=ON'
          export-pdb: true
          export-symbols: true
          combine: true
          target: ${{ matrix.config.target }}
          ccache-variant: 'sccache'

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: build
    permissions: write-all

    steps:
      - name: Combine builds
        uses: geode-sdk/build-geode-mod/combine@main
        with:
          zstd: true
          optimize-pngs: true
        id: build

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: globed-build-output
          path: ${{ steps.build.outputs.build-output }}

      - name: Get latest release tag
        id: getrelease
        run: echo "tag=$(curl -s https://api.github.com/repos/${{ github.event.repository.full_name }}/releases/latest | jq -r .tag_name)" >> $GITHUB_OUTPUT

      - name: Create nightly release
        uses: andelf/nightly-release@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: nightly
          name: 'Development Release'
          body: |
            This is a nightly build of Globed for commit ${{ github.sha }} (${{ github.event.head_commit.message }}).

            > **Note:** this build might not be stable and may contain issues, use at your own risk!

            Changes since the last release: ${{ github.event.repository.html_url }}/compare/${{ steps.getrelease.outputs.tag }}...nightly
          files: |
            ${{ steps.build.outputs.build-output }}/*.geode
            ${{ steps.build.outputs.build-output }}/*.pdb
